[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-trend-analysis-dashboard"
version = "0.1.0"
description = "Pipeline + Power BI dashboard analysing 2024-2025 Spotify music trends from a Kaggle dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Data Visualization course group" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long — ruff format handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "contract: end-to-end pipeline contract tests",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
pythonVersion = "3.11"
reportMissingImports = "warning"
